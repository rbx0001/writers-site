<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WRITERS — Opening app…</title>
  <meta name="theme-color" content="#070706" />
  <link rel="icon" type="image/jpeg" href="assets/writers-icon.jpg" />
  <link rel="apple-touch-icon" href="assets/writers-icon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main class="cb-wrap">
    <div class="cb-logo"><img src="writers-logo.jpg" alt="WRITERS" /></div>
    <h1>Opening WRITERS…</h1>
    <p>If the app doesn't open automatically, tap the button below.</p>
    <a href="writersapp://callback" class="cb-btn">Open in WRITERS</a>
    <p class="cb-redirect">This window can be closed once the app opens.</p>
  </main>

  <script>
    // Attempt to hand the callback straight back into the app via both the
    // custom scheme (writersapp://callback) and the HTTPS App Link, preserving
    // the full query string (Supabase PKCE ?code=...) so the exchange works.
    (function () {
      var query = window.location.search; // e.g. ?code=...
      var appUrl = 'writersapp://callback' + query;

      function openApp() {
        // Android custom-scheme deep link. If the app is installed and its
        // intent-filter matches, this launches it with the PKCE code intact.
        window.location.href = appUrl;
        // Fallback safety: if the app is not installed, the 404/error page
        // would show — so surface a hint instead.
        setTimeout(function () {
          var hint = document.getElementById('noApp');
          if (hint) hint.style.display = 'block';
        }, 2500);
      }

      openApp();
    })();
  </script>

  <p id="noApp" class="cb-hint">
    The WRITERS app isn't installed or couldn't be opened. Install it from the
    <a href="https://play.google.com/store/apps/details?id=com.writers.writers_app">Google Play Store</a>,
    then request a new reset link.
  </p>
</body>
</html>
